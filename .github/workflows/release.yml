# Push a tag that equals manifest.json's version (e.g. `git tag 1.0.0 && git push --tags`) to publish a
# GitHub release with main.js, manifest.json and styles.css — installable with the BRAT plugin.
name: Release
on:
  push:
    tags: ["*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match manifest version
        run: test "$GITHUB_REF_NAME" = "$(node -p "require('./manifest.json').version")"
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" main.js manifest.json styles.css
